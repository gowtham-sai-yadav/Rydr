# Render Blueprint - provisions the database and the API in one apply.
#
#   Render dashboard -> New -> Blueprint -> point at this repo
#
# The frontend is NOT here: it deploys to Vercel, which is better at Next.js
# than a container host and is free. See docs/DEPLOYMENT.md.
#
# Note on the free database tier: Render expires free Postgres instances after
# 30 days and then deletes them, which is why DATABASE_URL is no longer bound
# to the block below. It is set by hand, and currently points at a Supabase
# database that does not expire. See docs/DEPLOYMENT.md.
#
# The `databases:` block is kept so the Blueprint still provisions a local
# option and so rolling back is pasting one connection string. Delete it once
# the external database has proven itself.

databases:
  - name: rydr-db
    databaseName: rydr
    user: rydr
    plan: free

services:
  - type: web
    name: rydr-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health/ready
    envVars:
      # Set in the dashboard, not bound to the block above: `fromDatabase`
      # overwrites whatever is set by hand on every Blueprint sync, so the two
      # cannot coexist. Must be the *session* pooler string (IPv4, port 5432);
      # Supabase's direct connection is IPv6-only and Render has no IPv6
      # egress, and its transaction pooler on 6543 disables prepared
      # statements, which breaks Alembic.
      - key: DATABASE_URL
        sync: false
      # Generated once by Render and then held constant. Rotating it would
      # invalidate every issued JWT and sign every user out.
      - key: SECRET_KEY
        generateValue: true
      - key: APP_ENV
        value: prod
      # Must list the deployed frontend origin or every browser call fails
      # CORS. Set after the Vercel deploy exists.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: LOG_LEVEL
        value: INFO
      # Seed catalogue + demo activity on first boot. Turn off once the
      # database holds anything real.
      - key: SEED_ON_START
        value: "true"
      # Set to "true" for one deploy to rebuild the demo activity from
      # scratch, then set it back. Left on, every deploy wipes and rebuilds
      # the generated rides, posts, clubs and events.
      - key: SEED_FRESH
        value: "false"
      # Empty keeps OpenStreetMap. Set a token to move tiles, routing and
      # geocoding to Mapbox - required before real traffic, see the runbook.
      - key: MAPBOX_TOKEN
        sync: false
      # Blank disables signed uploads; media can still be attached by URL.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

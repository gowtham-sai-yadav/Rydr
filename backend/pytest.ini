[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Short tracebacks: these tests assert on API responses, so the useful
# information is the assertion line and the response body, not the framework
# frames between them.
addopts = -q --tb=short
filterwarnings =
    ignore::DeprecationWarning:passlib.*

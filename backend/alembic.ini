[alembic]
script_location = alembic
prepend_sys_path = .
# Fallback only. env.py overrides this with settings.DATABASE_URL, which
# reads the DATABASE_URL environment variable — that is what staging and
# the test database use. This value applies only when no environment is
# configured at all.
sqlalchemy.url = postgresql://rydr:rydr_secret@localhost:5432/rydr

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
